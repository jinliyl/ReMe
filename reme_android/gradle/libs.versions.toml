[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.14"
compose = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
room = "2.8.5"
work = "2.12.0"
navigation = "1.2.1"
coroutines = "1.11.0"
okhttp = "5.5.1"
android-test = "1.8.0-alpha04"
android-junit = "1.4.0-alpha04"
espresso = "3.8.0-alpha04"
[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-core" }
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
room = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
work = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
navigation = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
junit = { module = "junit:junit", version = "4.13.2" }
json-test = { module = "org.json:json", version = "20260814" }
test-runner = { module = "androidx.test:runner", version.ref = "android-test" }
test-rules = { module = "androidx.test:rules", version.ref = "android-test" }
test-junit = { module = "androidx.test.ext:junit", version.ref = "android-junit" }
espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
